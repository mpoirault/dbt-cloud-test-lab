---
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: dbt_cloud_terraform_max
version: 1.0.0
config-version: 2

# Links this project to dbt Cloud. project-id must be a LITERAL: dbt Cloud parses
# dbt_project.yml server-side, where local env vars are not available, so an
# env_var() reference fails at parse time ("Env var required but not provided").
# 551706 is a non-secret identifier (also in ~/.dbt/dbt_cloud.yml and TF state).
dbt-cloud:
  project-id: "551706"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths:
  - "models"
analysis-paths:
  - "analyses"
test-paths:
  - "tests"
seed-paths:
  - "seeds"
macro-paths:
  - "macros"
snapshot-paths:
  - "snapshots"
target-path: "target"  # directory which will store compiled SQL files
clean-targets:  # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
# In dbt, the default materialization for a model is a view. This means, when you run
# dbt run or dbt build, all of your models will be built as a view in your data platform.
# The configuration below will override this setting for models in the example folder to
# instead be materialized as tables. Any models you add to the root of the models folder
# will continue to be built as views. These settings can be overridden in the individual
# model files using the `{{ config(...) }}` macro.
models:
  dbt_cloud_terraform_max:
    +materialized: view

    staging:
      +schema: staging
      +group: core

    # intermediate subfolders are organized by business group
    intermediate:
      +schema: intermediate
      finance:
        +group: finance

    # marts subfolders are organized by business group; utilities is owned by core
    marts:
      +schema: marts
      +materialized: table
      core:
        +group: core
      finance:
        +group: finance
      marketing:
        +group: marketing
      utilities:
        +group: core

vars:
  # dbt_date defaults to America/Los_Angeles; all our timestamps are UTC
  "dbt_date:time_zone": UTC

seeds:
  dbt_cloud_terraform_max:
    +schema: seeds
    sources:
      +schema: raw
      raw_orders:
        +column_types:
          _ETL_LOADED_AT: timestamp
      raw_payments:
        +column_types:
          _BATCHED_AT: timestamp
