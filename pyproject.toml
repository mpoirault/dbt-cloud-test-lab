# Not a Python package, this file declares the uv-managed dev toolchain
# (exact versions resolved in uv.lock) and carries tool settings ([tool.*]).
# Binaries (dbt Cloud CLI, terraform, tflint, uv itself) are pinned in mise.toml.

[project]
name = "dbt-cloud-test-lab"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "dbt-bouncer>=3.7",
  "pre-commit>=4.6,<5",
  "pygments>=2.21,<3",
  "ruff>=0.15.21,<1",
  "rumdl>=0.2.30",
  "shandy-sqlfmt[jinjafmt]>=0.30,<1",
  "yamlfix>=1.19.1",
]

[tool.rumdl]
# Disable line-length (MD013): dbt docs and tables routinely exceed it.
disable = ["MD013"]

[tool.yamlfix]
# Gentle formatting: keep existing quotes, use block-style sequences, and preserve
# one blank line between sections (yamlfix's default whitelines = 0 strips them).
line_length = 120
preserve_quotes = true
sequence_style = "block_style"
whitelines = 1
